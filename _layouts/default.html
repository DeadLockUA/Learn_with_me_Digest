<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      {%- include news-rail.html -%}
      <div class="wrapper">
        {%- comment -%} Shared hero banner on every page except blog posts (posts carry their own image). {%- endcomment -%}
        {%- unless page.layout == "post" -%}
        <img class="site-hero" src="{{ '/assets/images/logo-ultrawide.jpg' | relative_url }}" alt="Learn with me Digest" style="display:block; width:100%; height:auto; border-radius:8px; margin-bottom:1.5rem;">
        {%- endunless -%}
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

  </body>

</html>
