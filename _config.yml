title: Learn with me Digest
description: >-
  Short entries on Development, Testing, AI, and Processes.
baseurl: "" # custom domain root
url: "https://yevhenprodan.com"

theme: minima

# Daily "News Around the World" pages, one file per day: _news/YYYY-MM-DD.md
collections:
  news:
    output: true
    permalink: /news/:name/

defaults:
  - scope:
      path: ""
      type: news
    values:
      layout: page

header_pages:
  - development.md
  - testing.md
  - ai.md
  - processes.md
  - news.md
  - about.md

# entries/ and assets/images/entries/ hold LinkedIn short-form text and
# per-entry images — not Jekyll content, keep them out of the build.
exclude:
  - entries
  - Gemfile
  - Gemfile.lock
  - README.md
  - AGENTS.md
  - BEHAVIOUR.md
  - CLAUDE.md
  - Concept.md
  - Customer_requirements.md
  - HLD.md
  - Themas.md
  - plans
  - models_benchmark.md
